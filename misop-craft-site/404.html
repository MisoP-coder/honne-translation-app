<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません | Miso-P craft</title>
<meta name="description" content="">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23D9572B%22/%3E%3Ctext x=%2232%22 y=%2245%22 font-size=%2236%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22700%22%3EM%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#FBF7F0;--card:#FFFFFF;--text:#2E2A25;--sub:#6F665B;--accent:#D9572B;--line:#EAE1D3;--shadow:0 2px 10px rgba(60,40,20,.08)}
@media (prefers-color-scheme: dark){:root{--bg:#191714;--card:#24211D;--text:#F2ECE3;--sub:#B5AA9B;--accent:#FF8A5C;--line:#3A342D;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.8;font-size:16px}
main{max-width:760px;margin:0 auto;padding:32px 16px 56px}
header h1{font-size:28px;margin:0;letter-spacing:.02em}
header p{margin:4px 0 0;color:var(--sub)}
h2{font-size:19px;margin:36px 0 12px}
a{color:var(--accent)}
.apps{display:grid;gap:16px}
.app{display:block;background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);text-decoration:none;color:inherit;border:1px solid var(--line)}
.app img{display:block;width:100%;height:auto;aspect-ratio:1200/630;object-fit:cover;background:var(--line)}
.app .body{padding:14px 18px 18px}
.app h3{margin:0;font-size:18px}
.app p{margin:6px 0 0;color:var(--sub);font-size:15px}
.app .go{display:inline-block;margin-top:10px;font-weight:700;color:var(--accent)}
.card{background:var(--card);border-radius:16px;padding:16px 18px;border:1px solid var(--line)}
ul{padding-left:1.4em} li{margin:4px 0}
footer{margin-top:40px;color:var(--sub);font-size:14px;display:flex;gap:16px;flex-wrap:wrap}
@media (min-width:640px){.apps{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main>
<header><h1>ページが見つかりません</h1><p>URL が変わったか、削除された可能性があります。</p></header><p><a href="/">トップへ戻る</a></p>
<footer><a href="/">トップ</a><a href="/privacy.html">プライバシーポリシー</a><span>© Miso-P</span></footer>
</main>
</body>
</html>
